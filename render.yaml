services:
  - type: web
    name: hospital-backend
    env: python
    region: oregon
    plan: free
    buildCommand: cd hospital_backend && chmod +x build.sh && ./build.sh
    startCommand: gunicorn --bind 0.0.0.0:$PORT --chdir hospital_backend hospital_project.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.4
      - key: DEBUG
        value: false
      - key: USE_SQLITE
        value: true
